<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{project_id}}</title>
  <link rel="icon" type="image/x-icon"
   href="/image/favicon.ico" />

  <link rel="stylesheet" type="text/css" class="ui" href="/lib/semantic.css">
  <link rel="stylesheet" type="text/css" class="ui" href="/lib/components/card.css">
  <!-- <link rel="stylesheet" type="text/css" class="ui" href="/lib/components/dropdown.css"> -->

  {% block head %}
  {% endblock %}

</head>

<body class="pushable">

<!-- menu sidebar -->
<div class="ui left vertical inverted labeled sidebar menu">
	<a href="" class="brand item">dhimmel.com</a>
	<a class="item {% if active_page == 'home' %} active{% endif%}" href="/">Home</a>
	<a class="item {% if active_page == 'about' %} active{% endif%}" href="/about">About</a>
	<div class="ui item{% if active_page == 'research' %} active{% endif%}">
    <span class="header">Research</span>
		<div class="menu">
	  {% for proj in projects %}
      <a class="item{% if project_id == proj.project_id %} active{% endif
  %}" href="/research/{{proj.project_id}}">{{proj.short}}</a>
    {% endfor %}
    </div>
	</div>
	<a class="item" href="//blog.dhimmel.com">Blog</a>
</div>

<div class="pusher" id="page-background">

  <div class="ui black huge launch right attached button">
    <i class="icon list layout"></i>
    <span class="text" style="display:none;">Menu</span>
  </div>
  
  {% block main %}
  {% endblock %}
  
</div>

<script src="/lib/jquery-3.1.0.min.js"></script>
<script src="/lib/semantic.js"></script>
<!-- <script src="/lib/components/dropdown.js"></script> -->


<script>
// From http://jsfiddle.net/hwc9sLb9/
$(".launch.button").mouseenter(function() {
  $(this).stop().animate({
      width: '150px'
    }, 300,
    function() {
      $(this).find('.text').show();
    });
}).mouseleave(function(event) {
  $(this).find('.text').hide();
  $(this).stop().animate({
    width: '70px'
  }, 300);
});
$(".ui.sidebar").sidebar().sidebar('attach events', '.ui.launch.button');
</script>

</body>

</html>
